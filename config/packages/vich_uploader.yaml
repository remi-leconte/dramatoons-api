vich_uploader:
    db_driver: orm
    mappings:
        webtoon_covers:
            uri_prefix: /upload/cover
            upload_destination: '%kernel.project_dir%/public/upload/cover'
            namer: App\Naming\WebtoonCoverNamer 
            delete_on_update: true # Supprime l'ancienne image du disque dur lors d'un changement
            delete_on_remove: true # Supprime l'image du disque si le webtoon est supprimé