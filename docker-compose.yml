services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    container_name: api_php
    volumes:
      - .:/var/www/html
    networks:
      - shared_database_network
      - api_internal_network

  nginx:
    image: nginx:stable-alpine
    container_name: api_nginx
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - api_internal_network

networks:
  shared_database_network:
    external: true
  api_internal_network:
    driver: bridge
    name: shared_api_network
