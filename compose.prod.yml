services:
  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
      target: prod # Si vous utilisez des builds multi-étapes dans votre Dockerfile
    environment:
      - APP_ENV=prod
      - APP_DEBUG=0
    # Pas de volume ici : le code est copié dans l'image au moment du build !

  nginx:
    ports:
      - "127.0.0.1:8081:80" # Binder UNIQUEMENT sur localhost pour le Reverse Proxy (ex: Traefik, Nginx Hôte ou Certbot)
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # En prod, Nginx n'a besoin que des fichiers statiques (public/)
      - ./public:/var/www/html/public:ro

  redis:
    # Pas de port exposé à l'extérieur : accessible uniquement sur le réseau interne Docker par PHP !
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
