services:
  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
      target: prod
    environment:
      - APP_ENV=prod
      - APP_DEBUG=0
    volumes:
      - uploads_data:/var/www/html/public/upload
      - ./config/jwt:/var/www/html/config/jwt

  nginx:
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - uploads_data:/var/www/html/public/upload:ro

  redis:
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
