name: Livraison

# Fusion d'une release dans main : l'image recettée devient la version vX.Y.Z sans être reconstruite,
# puis elle est déployée en recette pour une dernière vérification, et en production après approbation
on:
  push:
    branches:
      - main

permissions: {}

# Livraisons l'une après l'autre. Un run qui attend l'approbation de la production bloque le suivant :
# rejeter ce déploiement si la dernière vérification de la recette échoue
concurrency:
  group: livraison
  cancel-in-progress: false

jobs:
  release:
    name: Release fusionnée
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq "[.[] | select(.merge_commit_sha == \"$GITHUB_SHA\")][0] // {} | \"\(.head.ref // \"\") \(.head.sha // \"\")\"")
          read -r branche commit <<<"$pr"
          version=${branche#release/}
          # Seule la fusion d'une release, hotfix compris (il passe par sa propre release), a une image recettée à livrer
          if [[ $branche != release/* ]] || ! [[ $version =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::Pas une fusion de release/vX.Y.Z : rien n'est livré"
            exit 0
          fi
          # L'image livrée est celle du dernier commit de la release : main doit avoir exactement son contenu
          arbre_main=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" --jq .commit.tree.sha)
          arbre_release=$(gh api "repos/$GITHUB_REPOSITORY/commits/$commit" --jq .commit.tree.sha)
          if [[ $arbre_main != "$arbre_release" ]]; then
            echo "::error::main diffère du dernier commit recetté de $branche (hotfix non repris, conflit) : rien n'est livré"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$version" >/dev/null 2>&1; then
            echo "::error::Le tag $version existe déjà : rien n'est livré"
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "commit=$commit" >>"$GITHUB_OUTPUT"

  version:
    name: Version
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Étiquette de l'image recettée
        env:
          VERSION: ${{ needs.release.outputs.version }}
          COMMIT: ${{ needs.release.outputs.commit }}
        run: |
          image=ghcr.io/$GITHUB_REPOSITORY
          docker buildx imagetools create -t "$image:$VERSION" "$image:sha-${COMMIT::7}"

      # Après l'image : le tag annonce une version prête à déployer
      - name: Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$GITHUB_SHA"

  recette:
    name: Déploiement recette
    needs: [release, version]
    runs-on: ubuntu-24.04
    environment: staging
    permissions: {}
    steps:
      - name: Déploiement sur le serveur
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          (umask 077 && printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy)
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "deploy@$SSH_HOST" api "$VERSION"

  production:
    name: Déploiement production
    needs: [release, recette]
    runs-on: ubuntu-24.04
    # Attend l'approbation de l'utilisateur, donnée après la dernière vérification de la recette
    environment: production
    permissions: {}
    steps:
      - name: Déploiement sur le serveur
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          (umask 077 && printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy)
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "deploy@$SSH_HOST" api "$VERSION"
