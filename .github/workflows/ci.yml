name: CI

on:
  pull_request:
    branches:
      - main
      - 'release/*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifications:
    name: Vérifications
    runs-on: ubuntu-24.04
    env:
      # PHPStan lit le conteneur compilé dans var/cache/dev
      APP_ENV: dev
      APP_DEBUG: '1'
      # Jamais contactée : Doctrine exige seulement une URL valide avec la version du serveur
      DATABASE_URL: 'mysql://ci:ci@127.0.0.1:3306/ci?serverVersion=12.3.2-MariaDB&charset=utf8mb4'
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@2.40.0
        with:
          php-version: '8.4'
          extensions: intl, pdo_mysql, zip, apcu, redis
          tools: composer:v2
          coverage: none

      - uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - run: composer install --no-interaction --no-progress --prefer-dist

      - run: composer ci

  image:
    name: Image prod
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
