name: Publication

# Après la CI de la PR : publie l'image prod, celle que la recette puis la prod utiliseront telle quelle,
# puis déploie la recette. La version vX.Y.Z est livrée par livraison.yml, sans reconstruire l'image
on:
  push:
    branches:
      - 'release/*'

permissions: {}

# Deux fusions rapprochées : les publications passent l'une après l'autre, dans l'ordre, pour que
# release-vX.Y.Z soit écrite en dernier par le dernier commit, sans annuler une publication en cours
concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    # Distinct du check « Image prod » de la CI, exigé par le ruleset
    name: Publication image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  recette:
    name: Déploiement recette
    needs: image
    runs-on: ubuntu-24.04
    # Les secrets de connexion ne sont donnés qu'aux branches autorisées par l'environnement
    environment: staging
    # Lecture de la PR fusionnée par l'étape des statuts : PROJECT_TOKEN ne sert qu'au projet
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Déploiement sur le serveur
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          (umask 077 && printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy)
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "deploy@$SSH_HOST" api "$GITHUB_SHA"

      # Après le déploiement, sans pouvoir le faire échouer : un statut se corrige à la main, alors qu'un job
      # rouge pousserait à relancer le déploiement
      - name: Statuts des tickets
        continue-on-error: true
        shell: bash
        env:
          # Le GITHUB_TOKEN ne peut pas écrire dans un projet d'utilisateur
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PROJET: "PVT_kwHOAjbdoM4BgsYh"
          CHAMP_STATUT: "PVTSSF_lAHOAjbdoM4BgsYhzhfq9h4"
          STATUT_IN_QA: "df73e18b"
          LECTURE_PR: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Une relance (retour arrière, ou après un déploiement échoué) ne redéploie pas forcément la dernière
          # version du ticket : son statut se vérifie à la main
          if (( GITHUB_RUN_ATTEMPT > 1 )); then
            echo "::notice::Relance du job : statuts des tickets laissés tels quels, à vérifier à la main"
            exit 0
          fi
          branche=$(GH_TOKEN=$LECTURE_PR gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq "[.[] | select(.merge_commit_sha == \"$GITHUB_SHA\")][0].head.ref // \"\"")
          # Une synchronisation main → release n'a pas de ticket
          if ! [[ $branche =~ ^[a-z]+/#([0-9]+)- ]]; then
            echo "Pas une fusion de branche de ticket : aucun statut à changer"
            exit 0
          fi
          numero=${BASH_REMATCH[1]}
          # @me : le projet appartient au compte du jeton
          item=$(gh project item-list 4 --owner "@me" --format json -L 1000 \
            --jq ".items[] | select(.content.repository == \"$GITHUB_REPOSITORY\" and .content.number == $numero and .status == \"In Review\") | .id")
          if [[ -z $item ]]; then
            echo "::warning::Ticket #$numero introuvable en In Review (statut déjà changé, ou état renommé) : à vérifier à la main"
            exit 0
          fi
          gh project item-edit --project-id "$PROJET" --id "$item" --field-id "$CHAMP_STATUT" \
            --single-select-option-id "$STATUT_IN_QA"
          echo "Ticket #$numero : In QA"
