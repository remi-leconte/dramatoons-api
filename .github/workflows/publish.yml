name: Publication

# Après la CI de la PR : publie l'image prod, celle que la recette puis la prod utiliseront telle quelle,
# puis déploie la recette (branches release/* seulement)
on:
  push:
    branches:
      - 'release/*'
    tags:
      - 'v*'

permissions: {}

# Deux fusions rapprochées : les publications passent l'une après l'autre, dans l'ordre, pour que
# release-vX.Y.Z soit écrite en dernier par le dernier commit, sans annuler une publication en cours
concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    # Distinct du check « Image prod » de la CI, exigé par le ruleset
    name: Publication image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=sha,enable=${{ github.ref_type == 'branch' }}
            type=ref,event=tag

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  recette:
    name: Déploiement recette
    needs: image
    if: github.ref_type == 'branch'
    runs-on: ubuntu-24.04
    # Les secrets de connexion ne sont donnés qu'aux branches autorisées par l'environnement
    environment: staging
    permissions: {}
    steps:
      - name: Déploiement sur le serveur
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          (umask 077 && printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy)
          # La clé n'autorise côté serveur que le script de déploiement : seuls le composant et le commit sont transmis
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "deploy@$SSH_HOST" api "$GITHUB_SHA"
