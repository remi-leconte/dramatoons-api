name: dramatoons_api_dev

services:
  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
      target: dev
    depends_on:
      mariadb:
        condition: service_healthy
    user: "1000:1000"
    environment:
      - XDEBUG_CONFIG=client_host=host.docker.internal client_port=9003
      - HOME=/tmp
      - COMPOSER_HOME=/tmp/composer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/var/www/html

  nginx:
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  mariadb:
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - bdd_dev_data:/var/lib/mysql

volumes:
  bdd_dev_data: