name: dramatoons_api_staging

services:
  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
      target: prod
    environment:
      - APP_ENV=prod
      - APP_DEBUG=0
    volumes:
      - uploads_staging_data:/var/www/html/public/upload
      - ./config/jwt:/var/www/html/config/jwt
    networks:
      - shared_database_staging_network

  nginx:
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_staging_data:/var/www/html/public/upload

  redis:
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_staging_data:/data

  mariadb:
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - bdd_staging_data:/var/lib/mysql

volumes:
  redis_staging_data:
  uploads_staging_data:
  bdd_staging_data: