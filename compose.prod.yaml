name: dramatoons_api_${DEPLOY_ENV:?DEPLOY_ENV vaut staging ou prod}

services:
  php:
    # Image publiée par publish.yml : le serveur ne construit rien
    image: ghcr.io/remi-leconte/dramatoons-api:${IMAGE_TAG:?IMAGE_TAG vaut sha-<commit> ou vX.Y.Z}
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?}
      DATABASE_URL: mysql://${MARIADB_USER:?}:${MARIADB_PASSWORD:?}@mariadb:3306/${MARIADB_DATABASE:?}?serverVersion=12.3.2-MariaDB&charset=utf8mb4
      DEFAULT_URI: ${DEFAULT_URI:?}
      FRONTEND_URL: ${FRONTEND_URL:?}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:?}
      MAILER_DSN: ${MAILER_DSN:?}
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      DELETED_USER_PASSWORD: ${DELETED_USER_PASSWORD:-}
    volumes:
      - uploads_data:/var/www/html/public/upload
      - ./config/jwt:/var/www/html/config/jwt
    user: "0:0"

  nginx:
    ports:
      - "127.0.0.1:${HTTP_PORT:?}:80"
    entrypoint: [ "/bin/sh", "-c", "mkdir -p /var/www/html/public/upload && exec /docker-entrypoint.sh nginx -g 'daemon off;'" ]
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/var/www/html/public/upload

  redis:
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data

  mariadb:
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?}
      MARIADB_USER: ${MARIADB_USER:?}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?}
    volumes:
      - bdd_data:/var/lib/mysql

volumes:
  uploads_data:
    name: dramatoons_api_${DEPLOY_ENV}_uploads_${DEPLOY_ENV}_data
  redis_data:
    name: dramatoons_api_${DEPLOY_ENV}_redis_${DEPLOY_ENV}_data
  bdd_data:
    name: dramatoons_api_${DEPLOY_ENV}_bdd_${DEPLOY_ENV}_data
